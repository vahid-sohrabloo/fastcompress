name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ZSTD_TAG: v1.5.7

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache C reference (zstd source and CLI)
        uses: actions/cache@v4
        with:
          path: ref/zstd
          key: zstd-${{ env.ZSTD_TAG }}-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch C zstd and build CLI (no corpus)
        run: ref/fetch.sh --no-corpus
      # internal/creftest fails (rather than skips) under CI=true when cref is missing.
      - name: Build cref
        run: make -C ref/cref
      - name: Test
        run: go test -timeout 60m ./...
      # Also runs every Fuzz target's seed corpus with the assembly compiled out.
      - name: Test (noasm)
        run: go test -timeout 60m -tags noasm ./...
      - name: Test (386, short)
        if: runner.arch == 'X64'
        env:
          GOARCH: "386"
        run: go test -timeout 60m -short ./...
      - name: Test (race)
        if: runner.arch == 'X64'
        # The race runtime needs cgo on linux/amd64. The library itself has no
        # cgo; this is test tooling only.
        env:
          CGO_ENABLED: "1"
        run: go test -race -short ./...
      - name: API check (full)
        run: scripts/apicheck.sh

  fuzz-coverage:
    # Its own job: about 40 minutes of coverage plus 7 of fuzzing, run in
    # parallel with test.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache C reference (zstd source and CLI)
        uses: actions/cache@v4
        with:
          path: ref/zstd
          key: zstd-${{ env.ZSTD_TAG }}-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch C zstd and build CLI (no corpus)
        run: ref/fetch.sh --no-corpus
      - name: Build cref
        run: make -C ref/cref
      - name: Fuzz (20s per target)
        run: scripts/fuzz.sh -t 20s
      - name: Collect failing inputs
        if: failure() || cancelled()
        run: |
          mkdir -p fuzz-findings
          git ls-files -z --others --exclude-standard -- '*/testdata/fuzz/*' | xargs -0 -r cp --parents -t fuzz-findings
      - name: Upload failing inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings
          if-no-files-found: ignore
      - name: Coverage gate (decoder files, 95% of statements)
        run: |
          # -short: the full zstd suite under coverage runs over 90 minutes.
          go test -short -timeout 60m -coverprofile=cover.out ./zstd ./internal/huf
          awk '
            FNR == 1 { next }
            {
              split($1, a, ":"); f = a[1]
              if (f ~ /\/zstd\/zstd_decompress[^\/]*\.go$/) nz++
              else if (f ~ /\/internal\/huf\/huf_decompress[^\/]*\.go$/) nh++
              else next
              n[f, $1] = $2; files[f] = 1
              if ($3 > 0) hit[f, $1] = 1
            }
            END {
              for (k in n) { split(k, p, SUBSEP); tot[p[1]] += n[k]; if (k in hit) cov[p[1]] += n[k] }
              bad = 0
              for (f in files) {
                pct = 100 * cov[f] / tot[f]
                printf "%-72s %6.2f%% (%d/%d)\n", f, pct, cov[f], tot[f]
                if (pct < 95) { print "  below 95%"; bad = 1 }
              }
              if (nz == 0) { print "no zstd/zstd_decompress*.go in the profile"; bad = 1 }
              if (nh == 0) { print "no internal/huf/huf_decompress*.go in the profile"; bad = 1 }
              exit bad
            }' cover.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go vet (noasm)
        run: go vet -tags noasm ./...
      - name: go vet (386)
        env:
          GOARCH: "386"
        run: go vet ./...
      - name: go vet (arm64)
        env:
          GOARCH: arm64
        run: go vet ./...
      - name: Decoder safety check
        run: scripts/decodercheck.sh

  cross-build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: "386"}
          - {goos: linux, goarch: arm}
          - {goos: linux, goarch: ppc64le}
          - {goos: linux, goarch: s390x}
          - {goos: linux, goarch: riscv64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
